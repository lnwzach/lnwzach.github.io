<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9six – Big Eats Small</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf1;--cell:#fbfcfc;--ink:#14212b;--mute:#5d6e7a;--line:#c3d0d8;--x:#d6336c;--o:#0f8b8d;--hi:#c8efd9;--btn:#14212b;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--cell:#1a232b;--ink:#eaf1f5;--mute:#8fa1ad;--line:#2d3b46;--x:#ff5d95;--o:#33c1c3;--hi:#1d4d39;--btn:#eaf1f5;--btnt:#0e1419}}
:root[data-theme="dark"]{--bg:#0e1419;--cell:#1a232b;--ink:#eaf1f5;--mute:#8fa1ad;--line:#2d3b46;--x:#ff5d95;--o:#33c1c3;--hi:#1d4d39;--btn:#eaf1f5;--btnt:#0e1419}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
h1 small{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--mute);margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnt)}
.two .ai-only{display:none}
#status{font-size:20px;font-weight:800;min-height:28px;letter-spacing:-.01em}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1;container-type:size;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--cell);padding:0;cursor:pointer}
.cell.win{background:var(--hi)}
.pc{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.pc.X,.d.X{background:var(--x)}.pc.O,.d.O{background:var(--o)}
.s1{width:36%;font-size:14cqw}.s2{width:62%;font-size:26cqw}.s3{width:88%;font-size:42cqw}
.tray{display:flex;align-items:center;gap:8px}
.tray b{flex:1;font-size:15px}
.sz{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--cell);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.sz.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.sz:disabled{opacity:.4;cursor:default}
.d{display:inline-block;border-radius:50%}.d1{width:12px;height:12px}.d2{width:20px;height:20px}.d3{width:28px;height:28px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mute);font-size:14px}
#again{border:0;border-radius:10px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:800;min-height:44px;padding:0 18px;cursor:pointer}
.rules{margin:0;font-size:13px;color:var(--mute);max-width:60ch}
button:focus-visible{outline:3px solid var(--o);outline-offset:2px}
</style>
</head>
<body>
<main id="app" class="ai">
  <h1>9six<small>Big eats small. Three in a row wins.</small></h1>
  <div class="opts">
    <div class="seg" data-k="mode"><button data-v="ai" class="on">vs 9six</button><button data-v="two">2 players</button></div>
    <div class="seg ai-only" data-k="human"><button data-v="X" class="on">You go first</button><button data-v="O">9six goes first</button></div>
    <div class="seg ai-only" data-k="level"><button data-v="easy">Easy</button><button data-v="normal" class="on">Normal</button><button data-v="hard">Hard</button></div>
  </div>
  <div id="status" aria-live="polite"></div>
  <div class="tray-wrap" id="trayTop"></div>
  <div id="board"></div>
  <div class="tray-wrap" id="trayBot"></div>
  <div class="foot"><span id="score"></span><button id="again">New game</button></div>
  <p class="rules">Pick a size, then tap a square. A bigger piece covers a smaller one, yours or your rival’s. Only the top piece in each square counts. If nobody can move, it’s a draw.</p>
</main>
<script>
(()=>{
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const $=s=>document.querySelector(s), opp=p=>p==='X'?'O':'X';
let cells,stock,turn,over,win,wp,sel=1,mode='ai',human='X',level='normal',sc={X:0,O:0,D:0},job;
const top=i=>cells[i][cells[i].length-1];
const can=(i,s)=>{const t=top(i);return !t||t[1]<s};
const moves=p=>{const r=[];for(let s=3;s>=1;s--)if(stock[p][s-1]>0)for(const i of [4,0,2,6,8,1,3,5,7])if(can(i,s))r.push([i,s]);return r};
const winner=()=>{for(const l of L){const t=top(l[0]);if(t&&top(l[1])&&top(l[2])&&top(l[1])[0]===t[0]&&top(l[2])[0]===t[0])return l}return null};
const put=(p,i,s)=>{cells[i].push([p,s]);stock[p][s-1]--};
const unput=(p,i,s)=>{cells[i].pop();stock[p][s-1]++};

/* ---- 9six: iterative-deepening negamax with alpha-beta ---- */
let nodes,deadline;
function ev(p){const o=opp(p);let s=0;for(const l of L){let a=0,b=0;for(const i of l){const t=top(i);if(t)t[0]===p?a++:b++}if(!b)s+=[0,1,6][a];else if(!a)s-=[0,1,6][b]}return s+(stock[p][2]-stock[o][2])*2+stock[p][1]-stock[o][1]}
function nm(p,d,al,be){
  if(++nodes%2048===0&&Date.now()>deadline)throw 0;
  if(d===0)return ev(p);
  const ms=moves(p);if(!ms.length)return 0;
  let best=-1e9;
  for(const[i,s]of ms){put(p,i,s);const v=winner()?1000+d:-nm(opp(p),d-1,-be,-al);unput(p,i,s);
    if(v>best)best=v;if(best>al)al=best;if(al>=be)break}
  return best}
function think(){
  const p=turn,ms=moves(p).sort(()=>Math.random()-.5);
  if(level==='easy'&&Math.random()<.3)return ms[0];
  const maxD={easy:1,normal:3,hard:9}[level],snap=JSON.stringify([cells,stock]);
  deadline=Date.now()+(level==='hard'?650:300);nodes=0;
  let pick=ms[0];
  for(let d=1;d<=maxD;d++){
    let bm=null,bv=-1e9;
    try{
      for(const[i,s]of ms){put(p,i,s);const v=winner()?1000+d:-nm(opp(p),d-1,-1e9,1e9);unput(p,i,s);if(v>bv){bv=v;bm=[i,s]}}
    }catch(e){[cells,stock]=JSON.parse(snap);break}
    pick=bm;if(bv>=1000)break}
  return pick}

/* ---- game flow ---- */
function newGame(){clearTimeout(job);cells=Array.from({length:9},()=>[]);stock={X:[2,2,2],O:[2,2,2]};turn='X';over=false;win=wp=null;sel=1;render();kick()}
function kick(){if(!over&&mode==='ai'&&turn===opp(human))job=setTimeout(()=>{const m=think();place(m[0],m[1])},350)}
function place(i,s){
  const p=turn;put(p,i,s);const w=winner();
  if(w){over=true;win=w;wp=p;sc[p]++}
  else{turn=opp(p);if(!moves(turn).length){over=true;sc.D++}else if(!stock[turn][sel-1])sel=[1,2,3].find(k=>stock[turn][k-1])}
  render();kick()}
function render(){
  const ai=mode==='ai',aiSide=opp(human),name=p=>ai?(p===aiSide?'9six':'You'):'Player '+p;
  $('#board').innerHTML=cells.map((st,i)=>{const t=st[st.length-1];return `<button class="cell${win&&win.includes(i)?' win':''}" data-i="${i}" aria-label="Square ${i+1}">${t?`<span class="pc ${t[0]} s${t[1]}">${t[0]}</span>`:''}</button>`}).join('');
  const bot=ai?human:'X',tray=p=>`<div class="tray"><b style="color:var(--${p.toLowerCase()})">${name(p)} (${p})</b>${[1,2,3].map(s=>`<button class="sz${p===turn&&s===sel&&!over?' on':''}" data-p="${p}" data-s="${s}" ${over||p!==turn||(ai&&p===aiSide)||!stock[p][s-1]?'disabled':''}><i class="d d${s} ${p}"></i>×${stock[p][s-1]}</button>`).join('')}</div>`;
  $('#trayTop').innerHTML=tray(opp(bot));$('#trayBot').innerHTML=tray(bot);
  $('#status').textContent=over?(wp?(ai?(wp===aiSide?'9six wins!':'You win!'):`Player ${wp} wins!`):'Draw – no moves left'):(ai?(turn===aiSide?'9six is thinking…':'Your turn'):`Player ${turn}’s turn`);
  $('#score').textContent=`${name('X')} ${sc.X} · ${name('O')} ${sc.O} · Draws ${sc.D}`}
document.addEventListener('click',e=>{
  const c=e.target.closest('.cell'),z=e.target.closest('.sz'),g=e.target.closest('.seg button');
  if(g){const k=g.parentNode.dataset.k,v=g.dataset.v;g.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===g));
    if(k==='mode'){mode=v;$('#app').className=v}else if(k==='human')human=v;else level=v;sc={X:0,O:0,D:0};newGame();return}
  if(z&&!z.disabled){sel=+z.dataset.s;render();return}
  if(c&&!over&&!(mode==='ai'&&turn!==human)){
    const i=+c.dataset.i;
    if(!stock[turn][sel-1]){$('#status').textContent='Pick a size you still have';return}
    if(!can(i,sel)){$('#status').textContent='Use a bigger piece to cover that one';return}
    place(i,sel)}});
$('#again').onclick=newGame;
newGame();
})();
</script>
</body>
</html>
